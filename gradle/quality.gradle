// Quality gates: everything here runs on every build, locally and in CI, and fails the build when a
// rule is broken. Each rule is one that catches real robot bugs; none are style preferences.
//
//   ./gradlew ci                               every check CI runs; run it before pushing
//   ./gradlew test -Pquick --continuous        fast edit-test loop (skips the CI-only work)

// Quick mode skips the work only CI needs (static analysis, auto-formatting, coverage), which
// costs seconds on every save. `ci` still enforces all of it, and refuses to run in quick mode.
def quick = project.hasProperty("quick")
// The command line is the outermost build's: built as part of another build (a team's robot
// program includes this one), this build's own start parameters name no tasks.
def outermostBuild = gradle
while (outermostBuild.parent != null) {
    outermostBuild = outermostBuild.parent
}
def testsNamed = outermostBuild.startParameter.taskRequests.any { it.args.contains("--tests") }

// NullAway checks every package of the library's, and of the model it reads, so a null from the
// model can't reach localization unchecked.
def nullSafePackages = "com.michaelgrundvig.frc"
gradle.taskGraph.whenReady { graph ->
    if (quick && graph.allTasks.any { it.name == "ci" }) {
        throw new GradleException("-Pquick skips quality gates; run ci without it")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // A small set of compiler warnings promoted to errors; each is almost always a real bug.
    // Deprecation is left out while WPILib is in prerelease, or every update would fail builds.
    options.compilerArgs.addAll([
        "-Xlint:cast,divzero,empty,fallthrough,finally,overrides,rawtypes,unchecked",
        "-Werror",
    ])
    // Javadoc's references checked as the code compiles: a {@link}, @see or @param naming a class,
    // member or parameter that doesn't exist, or that this project can't see, fails the build, so
    // the docs can't drift from the code. Only references: a missing comment isn't a bug.
    options.compilerArgs.add "-Xdoclint:reference"
    // Error Prone (Google's bug finder) at error level only: its warnings are style advice, worth
    // reading in review, never worth failing a build over. NullAway (Uber's null checker) proves at
    // compile time that nothing can be null unless it is annotated @Nullable (org.jspecify).
    // MutablePublicArray: a public static final array's elements can still be changed by anyone, so
    // what ran before changes what runs next; share a List.of instead.
    // CheckReturnValue is an error already: the drivetrain's, the joints', the moves' and the gates'
    // classes are marked @CheckReturnValue, so a move or a gate made and dropped, `pivot.goTo(OUT);`
    // on a line of its own, never awaited, doesn't compile.
    options.errorprone {
        enabled = !quick
        disableAllWarnings = true
        disableWarningsInGeneratedCode = true
        excludedPaths = ".*/build/.*"
        errorproneArgs.addAll([
            "-Xep:MutablePublicArray:ERROR",
            // A few of its warnings, each one a real bug nearly every time it fires:
            // a private field, variable or method nothing uses (what was it meant to do?);
            "-Xep:UnusedVariable:ERROR",
            "-Xep:UnusedMethod:ERROR",
            // a value compared with itself, or subtracted from itself;
            "-Xep:IdentityBinaryExpression:ERROR",
            // a switch over an enum that leaves a case out, with no default;
            "-Xep:MissingCasesInEnumSwitch:ERROR",
            // int arithmetic that overflows before it's widened, or narrowed without saying so;
            "-Xep:IntLongMath:ERROR",
            "-Xep:NarrowingCompoundAssignment:ERROR",
            "-Xep:EqualsHashCode:ERROR",
            "-Xep:NullAway:ERROR",
            "-XepOpt:NullAway:AnnotatedPackages=" + nullSafePackages,
            "-XepOpt:NullAway:TreatGeneratedAsUnannotated=true",
        ])
    }
}

// Javadoc's examples are compiled code: {@snippet class=... region=...} shows a region of a source
// marked // @start region=... and // @end, found on these paths, and javadoc fails, naming it, on a
// class or region that isn't there. ci builds it, so a renamed example fails the build. Its
// comments are checked as the compiler checks them: references only.
tasks.named("javadoc", Javadoc) {
    def snippets = [
        file("src/main/java"),
        file("src/test/java"),
        file("src/testFixtures/java")
    ]
    .findAll { it.directory }
    inputs.files(snippets).withPropertyName("snippets").withPathSensitivity(PathSensitivity.RELATIVE)
    options.addStringOption("-snippet-path", snippets.join(File.pathSeparator))
    options.addBooleanOption("Xdoclint:reference", true)
    options.quiet()
}

// Tests produce a coverage report (JaCoCo), except in quick mode, which runs them without JaCoCo's
// agent (it instruments every class as it loads) and checks no coverage. None may run past two
// minutes (JUnit's default timeout; a test that needs longer says so with @Timeout): a hung test
// fails instead of hanging the build.
//
// Each project's tests may use up to 1.5 GB of memory, on every computer: left to itself, Java
// takes up to a quarter of the computer's memory. The tests need far less, so the cap guards
// against a runaway. A test that fails with "OutOfMemoryError: Java heap space" raises it here.
//
// At most two test JVMs run at once in a build, however many tasks Gradle runs in parallel. On a
// computer with 8 GB, make it one: testJvms=1 in the gradle.properties of your Gradle user home, or
// -PtestJvms=1. A build that includes this one counts the library's among its own.
def testJvmsAsked = (project.findProperty("testJvms") ?: "2").toString()
if (!(testJvmsAsked.isInteger() && testJvmsAsked.toInteger() >= 1)) {
    throw new GradleException("testJvms is how many test JVMs may run at once, 1 or more, not ${testJvmsAsked}")
}
def testJvms = gradle.sharedServices.registerIfAbsent("testJvms", TestJvms) {
    maxParallelUsages = testJvmsAsked.toInteger()
}
tasks.withType(Test).configureEach {
    usesService(testJvms)
}
tasks.named("test") {
    maxHeapSize = "1536m"
    systemProperty "junit.jupiter.execution.timeout.default", "2 m"
    extensions.getByType(JacocoTaskExtension).enabled = !quick
    if (!quick) {
        finalizedBy "jacocoTestReport"
    }
}

// --tests names tests by class or pattern, wherever they are: `./gradlew test --tests '*Arm*'` runs
// them in whichever project has them. A project
// with none of them passes, rather than failing the build as Gradle would; but if no project ran a
// test at all, the build fails, so a misspelled name can't pass quietly (testsMatched, below).
if (testsNamed) {
    tasks.withType(Test).configureEach {
        filter.failOnNoMatchingTests = false
        finalizedBy ":testsMatched"
    }
}
if (testsNamed && project == rootProject) {
    // The results of every test task in this build, as each last left them: a task that's up to
    // date, or restored from the build cache, ran these same tests last time.
    def results = objects.fileCollection()
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.findAll { it instanceof Test }.each {
            results.from(it.reports.junitXml.outputLocation.get().asFile)
        }
    }
    def asked = gradle.startParameter.taskRequests.collectMany { request ->
        def args = request.args
        (0..<args.size()).findAll { args[it] == "--tests" && it + 1 < args.size() }.collect { args[it + 1] }
    }.join(", ")
    tasks.register("testsMatched") {
        group = "verification"
        description = "Fail if --tests matched no test in any project."
        doLast {
            def ran = results.asFileTree.matching { include "TEST-*.xml" }.files
            if (ran.isEmpty()) {
                throw new GradleException("No test in any project matched --tests ${asked}: check the"
                + " class's name, or its package (a library's are com.michaelgrundvig.frc...)")
            }
        }
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}
tasks.named("jacocoTestReport") {
    dependsOn "test"
    onlyIf("-Pquick measures no coverage") { !quick }
    reports {
        xml.required = true
        html.required = true
    }
    // Generated code is not ours to test.
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            "**/BuildConstants*",
            "**/*AutoLogged*"
        ])
    }))
}

// Coverage floor: the build fails if coverage drops below the floors in coverage-floor.properties.
// Keys are "line" and "branch" for everything, or "<package/path>.line" and ".branch" for one
// package tree. "file.line" is a floor for every source file on its own, so a file with no tests
// fails even while the rest carries the total; "file.exempt" lists files it leaves out.
def coverageCheck = tasks.register("coverageCheck") {
    group = "verification"
    description = "Fail if test coverage drops below coverage-floor.properties."
    dependsOn "jacocoTestReport"
    onlyIf("-Pquick measures no coverage") { !quick }
    def report = layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml")
    def floorFile = file("coverage-floor.properties")
    inputs.file(floorFile)
    inputs.files(report).optional()
    doLast {
        def floors = new Properties()
        floorFile.withInputStream { floors.load(it) }
        def reportFile = report.get().asFile
        def xml = null
        if (reportFile.exists()) {
            def parser = new groovy.xml.XmlSlurper(false, false)
            // JaCoCo's report declares a DOCTYPE; allow the declaration, never fetch the DTD.
            parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
            parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
            xml = parser.parse(reportFile)
        }
        def coverage = { packages, String type ->
            double missed = 0, covered = 0
            packages.each { pkg ->
                def c = pkg.counter.find { it.@type == type }
                if (c.size() > 0) {
                    missed += c.@missed.toDouble()
                    covered += c.@covered.toDouble()
                }
            }
            return missed + covered > 0 ? 100.0 * covered / (missed + covered) : null
        }
        def scopes = floors.stringPropertyNames().findAll { !it.startsWith("file.") }.collect {
            it.contains(".") ? it.substring(0, it.lastIndexOf(".")) : ""
        }.unique().sort()
        def failures = []
        def fileFloorText = floors.getProperty("file.line")
        if (fileFloorText != null && xml != null) {
            double fileFloor = fileFloorText.toDouble()
            def exempt = (floors.getProperty("file.exempt") ?: "").split(",")*.trim().findAll { it }
            def lowest = null
            xml.package.each { pkg ->
                pkg.sourcefile.each { source ->
                    def path = "${pkg.@name}/${source.@name}".toString()
                    def lines = source.counter.find { it.@type == "LINE" }
                    if (lines.size() == 0 || path in exempt) {
                        return
                    }
                    double missed = lines.@missed.toDouble()
                    double covered = lines.@covered.toDouble()
                    double actual = 100.0 * covered / (missed + covered)
                    if (lowest == null || actual < lowest[1]) {
                        lowest = [path, actual]
                    }
                    if (actual < fileFloor) {
                        failures << String.format("%s line coverage %.1f%% is below the per-file floor %.1f%%", path, actual, fileFloor)
                    }
                }
            }
            if (lowest != null) {
                println String.format("Coverage %-20s %-6s %5.1f%% (floor %5.1f%%), lowest: %s", "each file", "line", lowest[1], fileFloor, lowest[0])
            }
        }
        scopes.each { scope ->
            def packages = xml == null ? [] : (scope
            ? xml.package.findAll {
                it.@name == scope || it.@name.text().startsWith(scope + "/")
            }
            : xml.package)
            def label = scope ?: "all"
            [line: "LINE", branch: "BRANCH"].each { key, type ->
                def floorText = floors.getProperty(scope ? "${scope}.${key}" : key)
                if (floorText == null) {
                    return
                }
                double floor = floorText.toDouble()
                def actual = coverage(packages, type)
                if (actual == null) {
                    println String.format("Coverage %-20s %-6s   no code yet (floor %5.1f%%)", label, key, floor)
                    return
                }
                println String.format("Coverage %-20s %-6s %5.1f%% (floor %5.1f%%)", label, key, actual, floor)
                if (actual < floor) {
                    failures << String.format("%s %s coverage %.1f%% is below the floor %.1f%%", label, key, actual, floor)
                }
            }
        }
        if (failures) {
            throw new GradleException(failures.join("; ") + ". Add tests for the new code.")
        }
    }
}
tasks.named("check") {
    dependsOn coverageCheck
}

// Formatting (google-java-format): local builds fix it automatically, so the careful path is the
// quick path; CI sets CI=true and only checks, so unformatted code fails there. LF on every OS.
if (System.getenv("CI") == null && !quick) {
    tasks.named("compileJava") {
        dependsOn "spotlessApply"
    }
}
spotless {
    lineEndings = "UNIX"
    java {
        target "src/**/*.java"
        toggleOffOn()
        // It removes unused imports itself: Spotless's removeUnusedImports() step would run its own
        // version of google-java-format, not the catalog's.
        googleJavaFormat(libs.versions.google.java.format.get())
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target "*.gradle", "gradle/*.gradle"
        greclipse(libs.versions.greclipse.get())
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Everything CI checks. Run it before pushing.
tasks.register("ci") {
    group = "verification"
    description = "Run every check CI runs: formatting, the gated build and tests, coverage."
    dependsOn "spotlessCheck", "build", "javadoc"
    // From the top of the build, every project's checks.
    dependsOn project.subprojects.collect { it.path + ":ci" }
}

/** Counts the test JVMs running at once, for Gradle to keep to its limit; it holds nothing. */
abstract class TestJvms implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
