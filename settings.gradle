// Localization: where an FRC robot is on the field, from its wheels, its IMUs and its cameras. One
// library: the contract a localizer keeps, two localizers that keep it, the solving of camera
// images into measurements, and the math of the calibration procedures.

pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-localization"

// Developing the libraries together: -PlocalLibs=<folder> builds the robot model from the clone in
// that folder's model/, from its source, in place of the published version this build otherwise
// reads (build.gradle), so a change to the model is seen here before it's published. Off unless
// asked for. Only the build that runs reads it: a build that includes this one decides for both.
def localLibs = providers.gradleProperty("localLibs").orNull
if (localLibs != null && gradle.parent == null) {
    def folder = new File(localLibs.startsWith("~") ? System.getProperty("user.home") + localLibs.substring(1) : localLibs)
    folder = folder.absolute ? folder : new File(settingsDir, localLibs)
    if (!folder.directory) {
        throw new GradleException("-PlocalLibs=${localLibs} isn't a folder: name the one holding model/")
    }
    def model = new File(folder, "model")
    if (new File(model, "settings.gradle").exists()) {
        logger.lifecycle("Building the robot model from ${model} (-PlocalLibs)")
        includeBuild(model) {
            // Its processor's project is docs-processor; it's published as frc-docs-processor.
            dependencySubstitution {
                substitute module("com.michaelgrundvig.frc:frc-docs-processor") using project(":docs-processor")
            }
        }
    }
}
