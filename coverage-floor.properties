# Coverage floor (gradle/quality.gradle): the build fails if test coverage drops below these
# percentages of the library's code, generated code excluded. 50% catches code with no tests at all,
# without every change chasing a number while the code is in heavy development. Only this build's
# own tests count: a robot program's tests run this code too, but a library's tests are what show it
# works on its own.
line=50.0
branch=50.0
# Every source file on its own, too: a file with no tests fails the build even while the rest of
# the code carries the total.
file.line=50.0
