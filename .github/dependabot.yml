# Weekly pull requests for newer build tools, test libraries, and CI actions. WPILib's libraries
# come with the robot model, and Gradle itself is updated deliberately, not by this bot.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "gradle-wrapper"
      - dependency-name: "org.wpilib*"
      - dependency-name: "org.ejml*"
      - dependency-name: "io.avaje:avaje-jsonb"
      - dependency-name: "us.hebi.quickbuf:quickbuf-runtime"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
