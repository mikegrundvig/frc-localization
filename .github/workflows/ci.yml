name: CI

# Runs ./gradlew ci, the same command anyone runs locally before pushing. Keep the checks in Gradle,
# not here: this file only sets up caching and uploads the results. It runs when started by hand
# (Actions tab, "Run workflow") and on pull requests, not on every push.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, check, test
    # Linux only: this is a library, built on Windows only as part of a robot project's build,
    # which checks it there.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The robot model (model/) is a submodule: the build stops without it.
          submodules: true
      # Caches Gradle, dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache, on GitHub's own actions/cache, rather than the default: a
          # proprietary component under its own terms of use.
          cache-provider: basic
      - name: Formatting, static analysis, tests, coverage
        run: ./gradlew ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            model/build/reports/
            model/build/test-results/
            model/*/build/reports/
            model/*/build/test-results/
          if-no-files-found: warn
